name: Deploy to Shared Hosting DomaiNesia via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, json, curl

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install PHP Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: 📦 Install Frontend Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            .git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.example
            *.md
            phpunit.xml

      - name: 🔄 Trigger Database Migration Webhook
        run: |
          SECRET="${{ secrets.DEPLOY_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET="rapi_secret_token_12345"
          fi
          curl -sS -k "https://rapi-drya.web.id/api/deploy-migrate-${SECRET}?seed=1" || echo "Webhook executed."
